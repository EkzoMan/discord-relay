services:
  discord-relay:
    build: .
    image: discord-relay:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Named volume keeps relay.db (and the legacy config.json) across
      # container restarts and redeploys.
      - relay-config:/data
    restart: unless-stopped

volumes:
  relay-config:
