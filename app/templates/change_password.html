{% extends "base.html" %}

{% block title %}Смена пароля — Discord Relay{% endblock %}

{% block content %}
  {% if flash %}
    <div class="alert alert-{{ 'ok' if flash_kind == 'ok' else 'error' }}">{{ flash }}</div>
  {% endif %}

  <section class="card login-card">
    <h2>Смена пароля</h2>
    <p class="muted">После смены пароля все остальные ваши сессии будут завершены.</p>
    <form method="post" action="/account/password">
      <label for="current_password">Текущий пароль</label>
      <input id="current_password" name="current_password" type="password" required
             autocomplete="current-password">

      <label for="new_password">Новый пароль (минимум 8 символов)</label>
      <input id="new_password" name="new_password" type="password" required minlength="8"
             autocomplete="new-password">

      <label for="confirm_password">Повторите новый пароль</label>
      <input id="confirm_password" name="confirm_password" type="password" required minlength="8"
             autocomplete="new-password">

      <p style="margin-top:1rem">
        <button class="btn btn-primary" type="submit">Сохранить</button>
      </p>
    </form>
  </section>

  <p class="muted"><a href="/">← Назад на панель</a></p>
{% endblock %}
